name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t hersonpc/hdt-dashboard:latest .

      # Confere que a imagem sobe e que os pacotes compilados carregam,
      # antes de publicar. Falha aqui interrompe o push.
      - name: Verificar a imagem
        run: |
          docker run --rm hersonpc/hdt-dashboard:latest python -c "
          import sys, numpy, pandas, streamlit, pyarrow, matplotlib, pytz
          print('python   ', sys.version.split()[0])
          print('numpy    ', numpy.__version__)
          print('pandas   ', pandas.__version__)
          print('streamlit', streamlit.__version__)
          "

      # O Docker Hub recebe apenas a tag latest. Tags datadas, quando existirem,
      # sao locais e servem so para retornar a uma construcao anterior na maquina.
      - name: Push Docker image
        run: docker push hersonpc/hdt-dashboard:latest
